name: Build PvZ Haxe Engine

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────
  #  WINDOWS
  # ─────────────────────────────────────────
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Install haxelibs
        shell: bash
        run: |
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib install flixel-addons --quiet
          haxelib install flixel-ui --quiet
          haxelib install flxAnimate --quiet
          haxelib install hxvlc --quiet
          haxelib install discord_rpc --quiet
          haxelib install sl-windows-api --quiet
          haxelib run lime setup -alias -y

      - name: Build
        run: lime build windows -release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PvZHaxeEngine-Windows
          path: export/release/windows/bin/

  # ─────────────────────────────────────────
  #  LINUX
  # ─────────────────────────────────────────
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxi-dev \
            libvlc-dev vlc-bin \
            g++ cmake

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Install haxelibs
        run: |
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib install flixel-addons --quiet
          haxelib install flixel-ui --quiet
          haxelib install flxAnimate --quiet
          haxelib install hxvlc --quiet
          haxelib run lime setup -alias -y

      - name: Build
        run: lime build linux -release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PvZHaxeEngine-Linux
          path: export/release/linux/bin/

  # ─────────────────────────────────────────
  #  MACOS
  # ─────────────────────────────────────────
  build-mac:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Install haxelibs
        run: |
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib install flixel-addons --quiet
          haxelib install flixel-ui --quiet
          haxelib install flxAnimate --quiet
          haxelib install hxvlc --quiet
          haxelib run lime setup -alias -y

      - name: Build
        run: lime build mac -release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PvZHaxeEngine-macOS
          path: export/release/mac/bin/

  # ─────────────────────────────────────────
  #  ANDROID
  # ─────────────────────────────────────────
  build-android:
    name: Build (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK r21e
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;21.4.7075529" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Install haxelibs
        run: |
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib install flixel-addons --quiet
          haxelib install flixel-ui --quiet
          haxelib install flxAnimate --quiet
          haxelib run lime setup -alias -y

      - name: Configure Android paths for lime
        run: |
          lime config ANDROID_SDK $ANDROID_SDK_ROOT
          lime config ANDROID_NDK_ROOT $ANDROID_SDK_ROOT/ndk/21.4.7075529
          lime config JAVA_HOME $JAVA_HOME

      - name: Build
        run: lime build android -release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PvZHaxeEngine-Android
          path: export/release/android/bin/app/build/outputs/apk/release/