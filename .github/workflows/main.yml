name: Build PvZ Haxe Engine

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────
  #  WINDOWS
  # ─────────────────────────────────────────
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe 4.3.4
        shell: pwsh
        run: |
          $url = "https://github.com/HaxeFoundation/haxe/releases/download/4.3.4/haxe-4.3.4-win64.zip"
          Invoke-WebRequest $url -OutFile haxe.zip
          Expand-Archive haxe.zip -DestinationPath C:\HaxeToolkit
          $haxeDir = Get-ChildItem C:\HaxeToolkit | Where-Object { $_.PSIsContainer } | Select-Object -First 1 -ExpandProperty FullName
          echo $haxeDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "HAXELIB_PATH=C:\haxelib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path C:\haxelib | Out-Null

      - name: Install haxelibs
        shell: pwsh
        run: |
          haxelib setup C:\haxelib
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel 6.2.0 --quiet
          haxelib install flixel-addons 4.0.1 --quiet
          haxelib install flixel-ui --quiet
          haxelib install hxvlc 2.2.6 --quiet
          haxelib install hxdiscord_rpc 1.3.0 --quiet
          haxelib git flxanimate https://github.com/Dot-Stuff/flxanimate master --quiet
          haxelib git flixel-animate https://github.com/MaybeMaru/flixel-animate main --quiet
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc master --quiet
          haxelib git sl-windows-api https://github.com/Slushi-Github/SL-Windows-API main --quiet

      - name: Build
        shell: pwsh
        run: haxelib run lime build windows -release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PvZHaxeEngine-Windows
          path: export/release/windows/bin/

  # ─────────────────────────────────────────
  #  LINUX
  # ─────────────────────────────────────────
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxi-dev \
            libvlc-dev vlc-bin \
            g++ cmake

      - name: Setup Haxe 4.3.4
        run: |
          curl -L https://github.com/HaxeFoundation/haxe/releases/download/4.3.4/haxe-4.3.4-linux64.tar.gz -o haxe.tar.gz
          tar -xzf haxe.tar.gz
          HAXE_DIR=$(find $PWD -maxdepth 1 -type d -name "haxe_*" | head -1)
          echo "$HAXE_DIR" >> $GITHUB_PATH
          echo "HAXELIB_PATH=$HOME/haxelib" >> $GITHUB_ENV
          mkdir -p $HOME/haxelib
          $HAXE_DIR/haxelib setup $HOME/haxelib

      - name: Install haxelibs
        run: |
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel 6.2.0 --quiet
          haxelib install flixel-addons 4.0.1 --quiet
          haxelib install flixel-ui --quiet
          haxelib install hxvlc 2.2.6 --quiet
          haxelib install hxdiscord_rpc 1.3.0 --quiet
          haxelib git flxanimate https://github.com/Dot-Stuff/flxanimate master --quiet
          haxelib git flixel-animate https://github.com/MaybeMaru/flixel-animate main --quiet

      - name: Build
        run: haxelib run lime build linux -release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PvZHaxeEngine-Linux
          path: export/release/linux/bin/

  # ─────────────────────────────────────────
  #  MACOS
  # ─────────────────────────────────────────
  build-mac:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe 4.3.4 (brew)
        run: |
          brew install haxe
          mkdir -p $HOME/haxelib
          echo "HAXELIB_PATH=$HOME/haxelib" >> $GITHUB_ENV
          haxelib setup $HOME/haxelib

      - name: Install haxelibs
        run: |
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel 6.2.0 --quiet
          haxelib install flixel-addons 4.0.1 --quiet
          haxelib install flixel-ui --quiet
          haxelib install hxvlc 2.2.6 --quiet
          haxelib install hxdiscord_rpc 1.3.0 --quiet
          haxelib git flxanimate https://github.com/Dot-Stuff/flxanimate master --quiet
          haxelib git flixel-animate https://github.com/MaybeMaru/flixel-animate main --quiet

      - name: Build
        run: haxelib run lime build mac -release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PvZHaxeEngine-macOS
          path: export/release/mac/bin/

  # ─────────────────────────────────────────
  #  ANDROID
  # ─────────────────────────────────────────
  build-android:
    name: Build (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK r21e + platform
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;21.4.7075529" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake

      - name: Setup Haxe 4.3.4
        run: |
          curl -L https://github.com/HaxeFoundation/haxe/releases/download/4.3.4/haxe-4.3.4-linux64.tar.gz -o haxe.tar.gz
          tar -xzf haxe.tar.gz
          HAXE_DIR=$(find $PWD -maxdepth 1 -type d -name "haxe_*" | head -1)
          echo "$HAXE_DIR" >> $GITHUB_PATH
          echo "HAXELIB_PATH=$HOME/haxelib" >> $GITHUB_ENV
          mkdir -p $HOME/haxelib
          $HAXE_DIR/haxelib setup $HOME/haxelib

      - name: Install haxelibs
        run: |
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel 6.2.0 --quiet
          haxelib install flixel-addons 4.0.1 --quiet
          haxelib install flixel-ui --quiet
          haxelib install hxdiscord_rpc 1.3.0 --quiet
          haxelib git flxanimate https://github.com/Dot-Stuff/flxanimate master --quiet
          haxelib git flixel-animate https://github.com/MaybeMaru/flixel-animate main --quiet

      - name: Configure Android paths for lime
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_SDK_ROOT
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_SDK_ROOT/ndk/21.4.7075529
          haxelib run lime config JAVA_HOME $JAVA_HOME

      - name: Build
        run: haxelib run lime build android -release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PvZHaxeEngine-Android
          path: export/release/android/bin/app/build/outputs/apk/release/